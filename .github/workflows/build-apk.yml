name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: schoolhub-debug-keystore-v1

      # 1) Полная сборка с офлайн-ИИ (llama.cpp)
      - name: Build APK (with offline AI)
        id: full
        continue-on-error: true
        run: gradle assembleDebug -PwithLlama=true --no-daemon --stacktrace

      # 2) Если нативная часть не собралась — всё равно выпускаем APK без ИИ-движка
      - name: Build APK (fallback, without AI engine)
        if: steps.full.outcome == 'failure'
        run: gradle clean assembleDebug -PwithLlama=false --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SchoolHub.apk
          if [ "${{ steps.full.outcome }}" = "success" ]; then
            echo "NOTE=✅ Сборка с офлайн-ИИ (llama.cpp)" >> $GITHUB_ENV
          else
            echo "NOTE=⚠️ Сборка без ИИ-движка: нативная часть не собралась, смотри лог шага 'Build APK (with offline AI)'" >> $GITHUB_ENV
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-apk
          path: SchoolHub.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SchoolHub • сборка ${{ github.run_number }}
          body: |
            ${{ env.NOTE }}
            Скачай SchoolHub.apk ниже и установи на Android 8.0+ (arm64).
          files: SchoolHub.apk
          make_latest: true
