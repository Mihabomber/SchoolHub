name: Build APK

on:
  push:
    branches: [ main, master, v2.1-dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Ключ подписи: сначала из секретов, иначе из истории main (тот же ключ, APK встанет поверх старой версии).
      - name: Signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          S_STORE: ${{ secrets.SIGNING_STORE_PASSWORD }}
          S_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          S_KEY: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/schoolhub.jks
          else
            echo "::warning::Нет секрета SIGNING_KEYSTORE_B64, беру ключ из main"
            git show origin/main:app/schoolhub.jks > app/schoolhub.jks
          fi
          echo "SIGNING_STORE_PASSWORD=${S_STORE:-schoolhub}" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=${S_ALIAS:-schoolhub}" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=${S_KEY:-schoolhub}" >> $GITHUB_ENV
          keytool -list -v -keystore app/schoolhub.jks -storepass "${S_STORE:-schoolhub}" | grep -E "SHA1|SHA256" || true

      - name: Firebase config
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then echo "$GS_JSON" > app/google-services.json; echo "google-services.json из секрета"; fi
          [ -f app/google-services.json ] && echo "Firebase подключён" || echo "Нет app/google-services.json, вход работать не будет"

      - name: "1) Full: llama.cpp b8720 + vision (Gemma 4)"
        id: s1
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease -PwithLlama=true -PwithVision=true -PllamaTag=b8720 --no-daemon --stacktrace 2>&1 | tee s1.log

      - name: "2) llama.cpp b8720 without vision"
        id: s2
        if: steps.s1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle clean assembleRelease -PwithLlama=true -PwithVision=false -PllamaTag=b8720 --no-daemon --stacktrace 2>&1 | tee s2.log

      - name: "3) llama.cpp b6550 (older, stable) + vision"
        id: s3
        if: steps.s1.outcome == 'failure' && steps.s2.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle clean assembleRelease -PwithLlama=true -PwithVision=true -PllamaTag=b6550 --no-daemon --stacktrace 2>&1 | tee s3.log

      - name: "4) Fallback without AI engine"
        id: s4
        if: steps.s1.outcome == 'failure' && steps.s2.outcome == 'failure' && steps.s3.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle clean assembleRelease -PwithLlama=false --no-daemon --stacktrace 2>&1 | tee s4.log

      # Ошибки компиляции видны в аннотациях запуска, без скачивания полного лога.
      - name: Report errors
        if: always()
        run: |
          for f in s1 s2 s3 s4; do
            [ -f "$f.log" ] || continue
            grep -E '^e: |error:|What went wrong|FAILED' -A2 "$f.log" \
              | grep -vE '^--$|^\s*$|at org\.gradle|at java\.|at kotlin\.' \
              | sed 's#file:///home/runner/work/SchoolHub/SchoolHub/##; s#/home/runner/work/SchoolHub/SchoolHub/##' \
              | cut -c1-400 | awk '!seen[$0]++' | head -40 > "$f.err" || true
            if [ -s "$f.err" ]; then
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f.err")
              echo "::error title=$f::$msg"
            fi
          done

      - name: Check result
        if: steps.s1.outcome != 'success' && steps.s2.outcome != 'success' && steps.s3.outcome != 'success' && steps.s4.outcome != 'success'
        run: |
          echo "::error::Ни один вариант сборки не прошёл"
          exit 1

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk SchoolHub.apk
          if [ "${{ steps.s1.outcome }}" = "success" ]; then N="Полная сборка: ИИ + зрение (llama.cpp b8720)";
          elif [ "${{ steps.s2.outcome }}" = "success" ]; then N="ИИ без зрения (b8720). Смотри лог шага 1";
          elif [ "${{ steps.s3.outcome }}" = "success" ]; then N="ИИ на старом llama.cpp b6550 (без Gemma 4). Смотри логи шагов 1-2";
          else N="Без ИИ-движка. Смотри логи шагов 1-3"; fi
          echo "NOTE=$N" >> $GITHUB_ENV
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "VC=$VC" >> $GITHUB_ENV
          echo "VN=$VN" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-apk
          path: SchoolHub.apk

      # Релиз по versionCode: release-8, release-9 и т.д. Повторный push с тем же versionCode обновляет APK в том же релизе.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2.1-dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ env.VC }}
          target_commitish: ${{ github.sha }}
          name: SchoolHub ${{ env.VN }} • релиз ${{ env.VC }}
          body: |
            ${{ env.NOTE }}
            Скачай SchoolHub.apk ниже и установи на Android 8.0+ (arm64). Ставится поверх старой версии, данные сохраняются.
          files: SchoolHub.apk
          make_latest: true
